# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Framework app to Azure Web App - inspinia-ivan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # 1. Configurar las herramientas de compilación para aplicaciones de .NET clásicas
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 2. Configurar NuGet para restaurar los paquetes de tu solución
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      # 3. Descargar todas las librerías necesarias usando la ruta de tu subcarpeta 'Full'
      - name: Restore NuGet Packages
        run: nuget restore Full/Inspinia.sln

      # 4. Compilar la aplicación y empaquetarla en una carpeta lista para producción
      - name: Build and Package Web App
        run: |
          msbuild Full/Inspinia.sln /p:Configuration=Release /p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=false /p:OutDir=../build_output

      # 5. Guardar la carpeta empaquetada temporalmente en GitHub
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: net-framework-app
          path: build_output/_PublishedWebsites/Inspinia

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: net-framework-app
          path: ./publish
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_ACFE52752201437EB800A904ADCB3B2C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_78BBE9926B2942B0932BEDF27666C083 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_345E9BC6AA884B4F90CEDDC9E7EC2AED }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'inspinia-ivan'
          slot-name: 'Production'
          package: ./publish
